<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ridge Demo Shop</title>
  <style>
    :root { --ink: #0b0d12; --pearl: #f5f5f7; --rule: #d9dee5; --muted: #5e6573; --cyan: #00b8e6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--pearl); color: var(--ink); }
    header { display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; border-bottom: 1px solid var(--rule); background: #fff; }
    h1 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
    .eyebrow { font: 11px/1 ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    main { display: grid; grid-template-columns: 1fr 320px; gap: 24px; padding: 24px 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .card { background: #fff; border: 1px solid var(--rule); border-radius: 2px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .price { font-family: ui-monospace, monospace; font-weight: 600; }
    button { cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--pearl); border-radius: 2px; padding: 8px 12px; font-weight: 600; }
    button:hover { background: transparent; color: var(--ink); }
    aside { background: #fff; border: 1px solid var(--rule); border-radius: 2px; padding: 16px; height: fit-content; }
    .row { display: flex; justify-content: space-between; padding: 4px 0; }
    .total { border-top: 1px solid var(--rule); margin-top: 8px; padding-top: 8px; font-weight: 700; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><div class="eyebrow">01 / Storefront</div><h1>Ridge Demo Shop</h1></div>
    <span class="eyebrow" id="status"></span>
  </header>
  <main>
    <section class="grid" id="products"></section>
    <aside>
      <div class="eyebrow">Cart</div>
      <div id="lines"></div>
      <div id="totals"></div>
      <button id="checkout" style="width:100%;margin-top:12px">Place order</button>
    </aside>
  </main>
  <script type="module">
    const money = (c) => `$${(c / 100).toFixed(2)}`;
    const cart = new Map();
    let catalog = [];

    async function render() {
      const items = [...cart].map(([id, qty]) => ({ id, qty }));
      document.getElementById("lines").innerHTML = items.length
        ? items.map((i) => `<div class="row"><span>${catalog.find((p) => p.id === i.id).name} × ${i.qty}</span></div>`).join("")
        : `<p class="eyebrow">Empty</p>`;
      const t = await (await fetch("/api/cart/total", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ items }) })).json();
      document.getElementById("totals").innerHTML =
        `<div class="row"><span>Subtotal</span><span class="price">${money(t.subtotal)}</span></div>` +
        (t.shipping != null ? `<div class="row"><span>Shipping</span><span class="price">${money(t.shipping)}</span></div>` : "") +
        `<div class="row total"><span>Total</span><span class="price">${money(t.total)}</span></div>`;
    }

    catalog = await (await fetch("/api/products")).json();
    document.getElementById("products").innerHTML = catalog
      .map((p) => `<div class="card"><div class="eyebrow">${p.category}</div><strong>${p.name}</strong><span class="price">${money(p.price)}</span><button data-id="${p.id}">Add to cart</button></div>`)
      .join("");
    document.getElementById("products").addEventListener("click", (e) => {
      const id = e.target.dataset?.id;
      if (!id) return;
      cart.set(id, (cart.get(id) ?? 0) + 1);
      render();
    });
    document.getElementById("checkout").addEventListener("click", async () => {
      const items = [...cart].map(([id, qty]) => ({ id, qty }));
      const r = await fetch("/api/orders", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ items }) });
      const o = await r.json();
      document.getElementById("status").textContent = r.ok ? `Order ${o.id} placed` : o.error;
      if (r.ok) { cart.clear(); render(); }
    });
    render();
  </script>
</body>
</html>
